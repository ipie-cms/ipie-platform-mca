# Shared, platform-wide system message bundle - only the generic codes
# in.gov.ipie.common.web.error.GlobalExceptionHandler itself produces, not any service's own
# domain ErrorCodes (those belong in that service's own messages_<lang>.properties instead). Keys
# are error codes, not free-form identifiers, so they stay in lockstep with GlobalExceptionHandler.
#
# This is the root/default bundle (no locale suffix) - see common-messages_hi.properties for the
# Hindi translations.
VALIDATION_FAILED=Request validation failed
UNAUTHENTICATED=Authentication is required
ACCESS_DENIED=You do not have permission to perform this action
INTERNAL_ERROR=An unexpected error occurred
MALFORMED_REQUEST=Request body could not be read
