# Shared SonarQube configuration template. Each service copies this file
# and only needs to change sonar.projectKey / sonar.projectName - every
# other rule (quality gate, coverage source, exclusions) is standard
# across the platform so results are comparable service to service.

sonar.projectKey=ipie_CHANGE_ME
sonar.projectName=CHANGE_ME
sonar.qualitygate.wait=true

sonar.sourceEncoding=UTF-8
sonar.java.source=21

sonar.sources=src/main/java
sonar.tests=src/test/java

sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test
sonar.junit.reportPaths=build/test-results/test
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Generated code and bootstrap classes are excluded from coverage/duplication
# metrics - they are not hand-written business logic.
sonar.coverage.exclusions=**/*MapperImpl.java,**/*Application.java,**/config/**,**/configuration/**
sonar.cpd.exclusions=**/*MapperImpl.java

# Quality gate baseline (see master standards doc section 10.2):
#   New code coverage      >= 80%
#   Duplicated lines        < 3%
#   Blocker/Critical issues = 0
#   New vulnerabilities     = 0
#   Security hotspots       reviewed