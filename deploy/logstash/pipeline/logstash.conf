# Logstash pipeline for iPIE service logs.
#
# Why Logstash is here at all, when the lines arrive already structured: on Docker Desktop's WSL2
# backend the daemon's container-log directory (/var/lib/docker/containers) is inside the
# docker-desktop VM and is NOT reachable from a container by any bind mount - verified on
# 2026-08-21 by mounting both that path and /run/desktop/mnt/host/var/lib/docker/containers, each
# of which yields an empty directory. That rules out the shipper-tails-stdout design (Filebeat,
# Fluent Bit, the OTel collector's filelog receiver) in this environment, because all of them read
# those files. What is left is the services pushing to a socket, and a socket needs something
# listening: this.
#
# So Logstash is doing transport, not parsing. The parse work was already done in-process by
# LogstashEncoder (common-observability's logback-json-console-appender.xml) - which is why the
# codec below is json_lines and there is no grok anywhere in this file.

input {
  tcp {
    port => 5044
    # LogstashTcpSocketAppender writes one JSON object per line. json_lines splits on the newline
    # and parses each - so `correlationId`, `traceId`, `service` arrive as real fields rather than
    # one opaque string, which is the entire point of the pipeline.
    codec => json_lines
  }
}

filter {
  # LogstashEncoder emits the event time as @timestamp already, and json_lines has just parsed it
  # into the event. Left alone deliberately: overwriting it with Logstash's ingest time would
  # replace "when this happened" with "when this arrived", and under load those differ by exactly
  # the amount you are usually trying to measure.

  # Deliberately NOT copying `service` to `service.name` to look more ECS-like. Tried on
  # 2026-08-24 and it broke ingest completely: Logstash reads "service.name" as a *nested* field
  # (object `service` with child `name`), while the encoder already sets `service` as a plain
  # string. Elasticsearch then rejects every single document with
  #   can't merge a non object mapping [service] with an object mapping
  # - a 400 per event, nothing indexed, and the only evidence is in Logstash's own log rather
  # than anywhere a user would look. `service` as a scalar is perfectly queryable; leave it.
}

output {
  elasticsearch {
    # elasticsearch-logs, NOT the elasticsearch on 9200: that one backs the "search users" read
    # path (UserSearchIndexConfig) and is a product dependency. Log volume must not compete with a
    # user-facing feature for heap and disk, and a log-driven disk-full must not take user search
    # down with it.
    hosts => ["http://elasticsearch-logs:9200"]
    # Daily indices, so retention is a matter of deleting old ones rather than deleting documents
    # (which in Lucene only marks them and reclaims nothing until a merge).
    index => "ipie-logs-%{+YYYY.MM.dd}"
  }
}
