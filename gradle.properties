org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Maven coordinates for the artifacts this repo publishes (ipie-common-libs, ipie-parent).
# Consumed by services once they build outside this monorepo; inside it they still use
# project(...) dependencies, so changing this version affects publication only.
group=in.gov.ipie
# The version this working tree produces. It is deliberately AHEAD of the released 0.1.0 that the
# services pin: a local publishToMavenLocal must never be able to overwrite the artifact a service
# is building against, which is exactly what a shared -SNAPSHOT allowed until 2026-08-31. Cutting a
# release means setting this to the release number, publishing, then moving it on again.
version=0.2.0-SNAPSHOT
