org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Maven coordinates for the artifacts this repo publishes (ipie-common-libs, ipie-parent).
# Consumed by services once they build outside this monorepo; inside it they still use
# project(...) dependencies, so changing this version affects publication only.
group=in.gov.ipie
# The version this repository publishes. 0.1.0 is the only version that has ever existed: the
# earlier local 0.1.0/0.2.0/0.3.0 artifacts and every -SNAPSHOT were deleted from Maven Local and
# this single release republished over the current tree, so nothing anywhere refers to a version
# that no longer exists.
#
# Two commands, not one, to publish it: `./gradlew publishToMavenLocal` skips ipie-build-conventions
# because it is an includeBuild, so `./gradlew -p ipie-build-conventions publishToMavenLocal` has to
# run too - and ipie-quality-config ships inside that plugin's jar, so a Checkstyle or SpotBugs
# config change reaches no service until it does. `-Pversion=` does not work for that build either;
# it reads this file directly so the version stays declared in one place. Edit the file.
#
# Because the tree and the released version are now the same number, republishing REPLACES the
# artifact every service builds against. Bump this to 0.2.0 before changing anything a service
# depends on, or a consumer will silently compile against different bytes under the same version.
#
# Publishing the release bytes to the shared registry is a separate step:
# deploy/github/publish-platform-release.sh 0.1.0 - blocked on a classic PAT with write:packages.
version=0.1.0
